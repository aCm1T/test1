name: CI

on:
  push:
  pull_request:

jobs:
  standalone-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:standalone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-browser-evidence
          path: artifacts/standalone-smoke
          if-no-files-found: error
          retention-days: 14

  authored-asset-profile:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report strict authored profile separately
        run: npm run qa:assets
